<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABO Formula Mastery Trainer</title>
<style>
:root{
  --ink:#1c2530; --sub:#5b6b7b; --line:#dbe2e8; --accent:#2461a8; --accent2:#c0392b;
  --bg:#f4f6f8; --panel:#ffffff; --good:#1e824c;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size:15px; line-height:1.5;}
h1,h2,h3{font-family: Georgia, "Times New Roman", serif; margin:0 0 8px;}
#app{display:flex; min-height:100vh;}

/* ---------------- sidebar ---------------- */
#sidebar{width:250px; flex:0 0 250px; background:#152a3d; color:#dce6ee; padding:18px 0; position:sticky; top:0; height:100vh; overflow-y:auto;}
#sidebar h1{font-size:17px; color:#fff; padding:0 16px 14px; border-bottom:1px solid #2a4258; margin-bottom:10px;}
#sidebar .grp-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#7c93a8; padding:14px 16px 4px;}
#sidebar button.navbtn{display:block; width:100%; text-align:left; background:none; border:none; color:#c9d7e3;
  padding:8px 16px; font-size:13.5px; cursor:pointer; border-left:3px solid transparent;}
#sidebar button.navbtn:hover{background:#1d3a54; color:#fff;}
#sidebar button.navbtn.active{background:#1d3a54; color:#fff; border-left-color:#4fa3e3; font-weight:600;}

/* ---------------- main content ---------------- */
#content{flex:1; padding:26px 34px 80px; max-width:980px;}
.formula-box{background:linear-gradient(135deg,#0f2942,#1d4a6e); color:#fff; border-radius:12px;
  padding:22px 26px; margin-bottom:18px; box-shadow:0 4px 14px rgba(0,0,0,.15);}
.formula-box .label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; opacity:.75; margin-bottom:6px;}
.formula-box .math{font-family:"Cambria Math", Georgia, serif; font-size:30px; font-weight:600;}
.formula-box .sub{font-size:13px; opacity:.85; margin-top:8px;}

.card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 22px; margin-bottom:18px;}
.card h2{font-size:16px; color:var(--accent); border-bottom:2px solid var(--line); padding-bottom:6px; margin-bottom:10px;}
.card ul{margin:6px 0 6px 20px; padding:0;}
.card li{margin-bottom:5px;}
.example{background:#eef4fa; border-left:4px solid var(--accent); padding:10px 14px; border-radius:0 6px 6px 0; margin:8px 0;}
.sourcenote{background:#fff8e6; border-left:4px solid #c9962b; padding:8px 14px; border-radius:0 6px 6px 0; margin:0 0 10px; font-size:12.5px; color:#6b5416;}
table.ref{width:100%; border-collapse:collapse; font-size:13px; margin:8px 0;}
table.ref th, table.ref td{border:1px solid var(--line); padding:5px 8px; text-align:center;}
table.ref th{background:#eaf0f6;}
.tag{display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; font-weight:700;}
.tag.compound{background:#fde3e3; color:#9a1d1d;}
.tag.cancel{background:#e1f2e6; color:#186c3f;}

/* controls */
.controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0 16px;}
.controls button{background:var(--accent); color:#fff; border:none; border-radius:6px; padding:8px 14px;
  font-size:13.5px; cursor:pointer; font-weight:600;}
.controls button.secondary{background:#5b6b7b;}
.controls button.ghost{background:#fff; color:var(--accent); border:1px solid var(--accent);}
.controls button:hover{filter:brightness(1.08);}
.count-note{font-size:12.5px; color:var(--sub); margin-left:auto;}

/* problems (on-screen) */
.problem{border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-bottom:10px; background:#fff;}
.problem .qn{font-weight:700; color:var(--accent); margin-right:6px;}
.problem .qtext{white-space:pre-line;}
.problem .ans{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); color:var(--good); white-space:pre-line; font-size:13.5px;}
.problem .ans b{color:var(--accent2);}
#problemList.hide-answers .ans{display:none;}
.problem .diagwrap{display:flex; justify-content:center; margin:6px 0;}

/* svg diagram */
svg.prism-diagram{width:320px; height:222px;}
.sclera{fill:#fff; stroke:#2a3b4a; stroke-width:2;}
.iris{fill:#8fc6e0; stroke:#2b4c5e; stroke-width:1;}
.pupil{fill:#141b22;}
.glint{fill:#fff;}
.brow{fill:none; stroke:#2a3b4a; stroke-width:3; stroke-linecap:round; opacity:.55;}
.nose{fill:none; stroke:#9aa8b3; stroke-width:2;}
.prism-tri{fill:rgba(192,57,43,.5); stroke:#9a1d1d; stroke-width:1.5;}
.prism-tri-mirror{fill:rgba(120,130,140,.18); stroke:#8a97a3; stroke-width:1; stroke-dasharray:3 2;}
.oc-dot{fill:#1c2530; stroke:#fff; stroke-width:1;}
.eyelabel{font-weight:700; font-size:13px; text-anchor:middle; fill:#1c2530; font-family:Arial,sans-serif;}
.prismlabel{font-size:12px; text-anchor:middle; fill:#9a1d1d; font-weight:700; font-family:Arial,sans-serif;}

.legendbox{display:flex; align-items:center; gap:18px; background:#f7fafc; border:1px dashed var(--line); border-radius:8px; padding:10px 16px;}
.anatomy-img{max-width:100%; display:block; margin:10px auto; border:1px solid var(--line); border-radius:8px;}
.anatomy-cap{text-align:center; font-size:11.5px; color:var(--sub); margin:-4px 0 10px;}
.anatomy-refs{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin:10px 0;}
.anatomy-refs figure{margin:0; max-width:300px;}
.anatomy-refs img{max-width:100%; border:1px solid var(--line); border-radius:8px; display:block;}
.anatomy-refs figcaption{text-align:center; font-size:11.5px; color:var(--sub); margin-top:4px;}

footer.note{font-size:12px; color:var(--sub); margin-top:30px; border-top:1px solid var(--line); padding-top:10px;}

/* ---------------- print sheets ---------------- */
#printArea{display:none;}
.sheet{padding:6mm 2mm; page-break-after:always;}
.sheet:last-child{page-break-after:auto;}
.sheet h2{font-size:18px; margin-bottom:2px;}
.sheet .pagemeta{font-size:11px; color:#666; margin-bottom:10px;}
.sheet .problem{border:1px solid #999; border-radius:6px; padding:10px 14px; margin-bottom:12px; break-inside:avoid; page-break-inside:avoid;}
.sheet .workspace{border:1px dashed #aaa; border-radius:6px; min-height:60px; margin-top:8px;}
.sheet .workspace.compact{min-height:30px;}
.answerline{padding:4px 0; border-bottom:1px dotted #ccc; font-size:12.5px;}
.answerline b{color:#000;}
.printhead{display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid #333; margin-bottom:8px; padding-bottom:4px;}
.printhead .brand{font-size:11px; color:#777;}

@media print{
  .no-print{display:none !important;}
  body.print-mode #app{display:none !important;}
  body.print-mode #printArea{display:block !important;}
  body:not(.print-mode) #printArea{display:none !important;}
  @page{ size: letter portrait; margin: 12mm; }
}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar" class="no-print">
    <h1>ABO Formula Mastery</h1>
    <div id="navlist"></div>
  </nav>
  <main id="content"></main>
</div>

<div id="printArea"></div>

<script>
/* ============================================================
   MATH / FORMAT HELPERS  (validated against the ABO study guide's
   own worked examples — see build notes)
   ============================================================ */
function round2(x){ return Math.round((x + Number.EPSILON) * 100) / 100; }
function round25(x){ return Math.round((x + Number.EPSILON) * 4) / 4; }
function fmtPow(n){ n = round25(n); const sign = n >= 0 ? '+' : '-'; return sign + Math.abs(n).toFixed(2); }
function fmtMag(n){ return Math.abs(round25(n)).toFixed(2); }
function rndItem(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function rndInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function chunk(arr,size){ const out=[]; for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size)); return out; }

const NICE_SPHERES = [0.25,0.50,0.75,1.00,1.25,1.50,1.75,2.00,2.25,2.50,3.00,3.50,4.00,4.50,5.00,6.00,7.00,8.00,9.00,10.00,12.00];
function rndSphere(){ const m = rndItem(NICE_SPHERES); return (Math.random()<0.5?-1:1)*m; }
const CYL_MAGS = [0.25,0.50,0.75,1.00,1.25,1.50,1.75,2.00,2.50,3.00];
function rndCylMinus(){ return -rndItem(CYL_MAGS); }
const AXES = [10,15,20,30,45,60,70,75,90,100,110,120,135,150,160,170,180];
function rndAxis(){ return rndItem(AXES); }

/* ---- Prentice's Rule engine ---- */
// decErrorDir: the direction the LENS OPTICAL CENTER was mis-positioned
// ('up'/'down' for OC-height errors, 'nasal'/'temporal' for horizontal decentration)
// Rule (derived from lens-as-prism theory & verified against 3 PDF worked examples):
//   PLUS  lens -> induced base direction = SAME as decErrorDir
//   MINUS lens -> induced base direction = OPPOSITE of decErrorDir
function inducedDir(sphere, axisType, decErrorDir){
  const isPlus = sphere > 0;
  if (axisType === 'V') {
    if (decErrorDir === 'up')   return isPlus ? 'BU' : 'BD';
    else                        return isPlus ? 'BD' : 'BU';
  } else {
    if (decErrorDir === 'nasal') return isPlus ? 'BI' : 'BO';
    else                          return isPlus ? 'BO' : 'BI';
  }
}
function prenticeP(sphere, mm){ return round25(Math.abs(sphere) * (mm/10)); }

// Compounding / canceling chart exactly as given in the ABO guide:
//   CANCEL (subtract):  BU/BU , BD/BD , BI/BO
//   COMPOUND (add):     BU/BD , BI/BI , BO/BO
function combinePrism(dir1, mag1, dir2, mag2){
  const key = dir1 + '/' + dir2;
  const compound = { 'BU/BD':1, 'BD/BU':1, 'BI/BI':1, 'BO/BO':1 };
  const cancel   = { 'BU/BU':1, 'BD/BD':1, 'BI/BO':1, 'BO/BI':1 };
  if (compound[key]) return { mode:'compound', total: round25(mag1+mag2) };
  if (cancel[key])   return { mode:'cancel', total: round25(Math.abs(mag1-mag2)), dominant: mag1>=mag2?dir1:dir2 };
  return { mode:'n/a', total:null };
}
function dirWord(d){ return {BU:'Base Up', BD:'Base Down', BI:'Base In', BO:'Base Out'}[d] || d; }

/* ============================================================
   SVG EYE / PRISM DIAGRAM
   A lens is really two prisms fused together: MINUS = apex-to-apex
   (an hourglass), PLUS = base-to-base (a diamond/kite). The fused
   point (or edge) IS the lens's optical center. When the OC gets
   decentered, the whole two-triangle shape slides to its new,
   mis-positioned location — but the eye itself doesn't move. So the
   eye ends up sitting inside whichever HALF of the shape now covers
   it, off-center. That's the diagram drawn below: a small dot marks
   the shifted OC, and the eye sits inside the shaded "active" half;
   the pale mirror-image half completes the hourglass/diamond so you
   can see the whole lens.
   ============================================================ */
function eyeSVG(cx,cy,r){
  return `<circle cx="${cx}" cy="${cy}" r="${r}" class="sclera"/>`+
         `<circle cx="${cx}" cy="${cy}" r="${r*0.55}" class="iris"/>`+
         `<circle cx="${cx}" cy="${cy}" r="${r*0.22}" class="pupil"/>`+
         `<circle cx="${cx-r*0.18}" cy="${cy-r*0.18}" r="${r*0.09}" class="glint"/>`;
}
// errAbsDir = the screen direction ('up'/'down'/'left'/'right') the LENS
// OPTICAL CENTER was mis-positioned relative to the eye (already resolved
// from nasal/temporal using OD/OS side — see resolveAbsDir()).
function compositeSVG(ex,ey, errAbsDir, isPlus, mm){
  if(!errAbsDir) return '';
  const offsetPx = Math.max(12, Math.min(42, mm*5));   // how far the OC has shifted from the eye, on screen
  const L = offsetPx + 26;                              // triangle half-length (long enough the eye sits inside it)
  const W = 15;                                         // triangle half-width
  const dv   = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]}[errAbsDir]; // eye -> OC direction
  const toEye= [-dv[0], -dv[1]];                          // OC -> eye direction (where the eye actually sits)
  const perp = (errAbsDir==='up'||errAbsDir==='down') ? [1,0] : [0,1];
  const oc        = [ex + dv[0]*offsetPx,        ey + dv[1]*offsetPx];
  const farActive  = [oc[0] + toEye[0]*L, oc[1] + toEye[1]*L];   // beyond the eye - the half that CONTAINS the eye
  const farMirror  = [oc[0] + dv[0]*L,    oc[1] + dv[1]*L];      // the other half, just for completeness
  const a1=[farActive[0]+perp[0]*W, farActive[1]+perp[1]*W], a2=[farActive[0]-perp[0]*W, farActive[1]-perp[1]*W];
  const m1=[farMirror[0]+perp[0]*W, farMirror[1]+perp[1]*W], m2=[farMirror[0]-perp[0]*W, farMirror[1]-perp[1]*W];
  let activePts, mirrorPts;
  if(!isPlus){
    // MINUS lens: two prisms apex-to-apex -> shared APEX sits exactly at the (shifted) OC
    activePts = `${oc[0]},${oc[1]} ${a1[0]},${a1[1]} ${a2[0]},${a2[1]}`;
    mirrorPts = `${oc[0]},${oc[1]} ${m1[0]},${m1[1]} ${m2[0]},${m2[1]}`;
  } else {
    // PLUS lens: two prisms base-to-base -> shared BASE edge sits at the (shifted) OC
    const e1=[oc[0]+perp[0]*W, oc[1]+perp[1]*W], e2=[oc[0]-perp[0]*W, oc[1]-perp[1]*W];
    activePts = `${farActive[0]},${farActive[1]} ${e1[0]},${e1[1]} ${e2[0]},${e2[1]}`;
    mirrorPts = `${farMirror[0]},${farMirror[1]} ${e1[0]},${e1[1]} ${e2[0]},${e2[1]}`;
  }
  return `<polygon points="${mirrorPts}" class="prism-tri-mirror"/>`+
         `<polygon points="${activePts}" class="prism-tri"/>`+
         `<circle cx="${oc[0]}" cy="${oc[1]}" r="2.4" class="oc-dot"/>`;
}
function resolveAbsDir(errDir, side){
  if(errDir==='up' || errDir==='down') return errDir;
  if(errDir==='nasal')    return side==='OD' ? 'right' : 'left';   // toward the nose
  if(errDir==='temporal') return side==='OD' ? 'left'  : 'right';  // toward the temple
  return null;
}
// od/os shape: { dir, mag, isPlus, errAbsDir, mm } or null for plano
function eyeDiagramSVG(od, os, blank){
  const W=360,H=250, odX=105, osX=255, eyeY=128, r=20;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" class="prism-diagram">`;
  s += `<path d="M ${odX-38} ${eyeY-40} Q ${odX} ${eyeY-54} ${odX+38} ${eyeY-40}" class="brow"/>`;
  s += `<path d="M ${osX-38} ${eyeY-40} Q ${osX} ${eyeY-54} ${osX+38} ${eyeY-40}" class="brow"/>`;
  s += `<path d="M ${W/2-4} ${eyeY-6} L ${W/2+2} ${eyeY+34} L ${W/2+12} ${eyeY+40}" class="nose"/>`;
  if(!blank){
    if(od && od.errAbsDir) s += compositeSVG(odX,eyeY, od.errAbsDir, od.isPlus, od.mm);
    if(os && os.errAbsDir) s += compositeSVG(osX,eyeY, os.errAbsDir, os.isPlus, os.mm);
  }
  s += eyeSVG(odX,eyeY,r);
  s += eyeSVG(osX,eyeY,r);
  s += `<text x="${odX}" y="${H-28}" class="eyelabel">OD</text>`;
  s += `<text x="${osX}" y="${H-28}" class="eyelabel">OS</text>`;
  if(!blank){
    s += `<text x="${odX}" y="${H-10}" class="prismlabel">${od&&od.dir? fmtMag(od.mag)+'&#916; '+od.dir : 'Plano'}</text>`;
    s += `<text x="${osX}" y="${H-10}" class="prismlabel">${os&&os.dir? fmtMag(os.mag)+'&#916; '+os.dir : 'Plano'}</text>`;
  }
  s += `</svg>`;
  return s;
}

/* ============================================================
   PROBLEM GENERATORS PER TOPIC
   Every generate(n) returns [{q:htmlString, a:htmlString, tall:bool}]
   ============================================================ */

/* ---- Diopter Formula ---- */
const D_VALS=[0.25,0.50,0.75,1.00,1.25,1.50,2.00,2.50,3.00,4.00,5.00,6.00,8.00,10.00];
function genDiopter(n){
  const out=[];
  for(let i=0;i<n;i++){
    // Always start from a clean quarter-diopter power so both directions
    // of the formula round-trip to the same clean D value.
    const D=rndItem(D_VALS), f=round2(1/D);
    if(Math.random()<0.5){
      out.push({ q:`A lens has a power of <b>${D.toFixed(2)} D</b>. What is its focal length, in meters?`,
                 a:`f = 1/D = 1/${D.toFixed(2)} = <b>${f.toFixed(2)} m</b>` });
    } else {
      out.push({ q:`A lens has a focal length of <b>${f.toFixed(2)} m</b>. What is its power, in diopters?`,
                 a:`D = 1/f = 1/${f.toFixed(2)} = <b>${D.toFixed(2)} D</b>` });
    }
  }
  return out;
}

/* ---- Index of Refraction ---- */
const INDEXES=[1.498,1.523,1.53,1.586,1.60,1.67,1.70,1.74];
function genIndex(n){
  const out=[];
  for(let i=0;i<n;i++){
    let a=rndItem(INDEXES), b=rndItem(INDEXES);
    while(b===a) b=rndItem(INDEXES);
    const pow = rndItem([2.00,4.00,6.00,8.00,10.00]);
    const winner = a>b? 'A':'B';
    out.push({ q:`Lens A has an index of refraction of <b>${a}</b>. Lens B has an index of <b>${b}</b>. Both are ground to the same ${pow.toFixed(2)}D power. Which lens will be <b>thinner</b>?`,
               a:`Lens <b>${winner}</b> (n=${winner==='A'?a:b}). Higher index of refraction = thinner lens for the same power.` });
  }
  return out;
}

/* ---- Nominal Lens Formula ---- */
function genNominal(n){
  const out=[];
  for(let i=0;i<n;i++){
    const D1=rndSphere(), D2=rndSphere(), DL=round25(D1+D2);
    out.push({ q:`D1 = ${fmtPow(D1)}     D2 = ${fmtPow(D2)}\nFind DL (total lens power) using DL = D1 + D2.`,
               a:`DL = ${fmtPow(D1)} + (${fmtPow(D2)}) = <b>${fmtPow(DL)}</b>` });
  }
  return out;
}

/* ---- The Optical Cross ---- */
function genCross(n){
  const out=[];
  for(let i=0;i<n;i++){
    const sphere=rndSphere(), cyl=rndCylMinus(), axis=Math.random()<0.5?90:180;
    let p90,p180;
    if(axis===180){ p180=sphere; p90=round25(sphere+cyl); }
    else { p90=sphere; p180=round25(sphere+cyl); }
    out.push({ q:`Rx: ${fmtPow(sphere)} ${fmtPow(cyl)} X ${axis}\nFind the lens power at the 180&deg; meridian and at the 90&deg; meridian.`,
               a:`Axis ${axis} carries the sphere power alone; the cylinder shows up 90&deg; away.\nPower @180&deg; = <b>${fmtPow(p180)}</b>     Power @90&deg; = <b>${fmtPow(p90)}</b>` });
  }
  return out;
}

/* ---- Power in Oblique Meridians ---- */
function genOblique(n){
  const out=[];
  for(let i=0;i<n;i++){
    const sphere=rndSphere(), cyl=rndCylMinus();
    const axis=rndAxis();
    let theta=rndAxis(), tries=0;
    while(theta===axis && tries<5){ theta=rndAxis(); tries++; }
    const diff = theta-axis;
    const sin2 = round2(Math.pow(Math.sin(diff*Math.PI/180), 2));
    const power = round25(sphere + cyl*sin2);
    out.push({ q:`Rx: ${fmtPow(sphere)} ${fmtPow(cyl)} X ${axis}\nFind the lens power at the ${theta}&deg; meridian.`,
               a:`D&theta; = Sphere + Cyl &times; sin&sup2;(&theta; &minus; Axis)\n`+
                 `D&theta; = ${fmtPow(sphere)} + (${fmtPow(cyl)}) &times; sin&sup2;(${theta}&deg;&minus;${axis}&deg;)\n`+
                 `sin&sup2;(${diff}&deg;) = ${sin2.toFixed(2)}\n`+
                 `D&theta; = ${fmtPow(sphere)} + (${fmtPow(cyl)} &times; ${sin2.toFixed(2)}) = <b>${fmtPow(power)}</b>` });
  }
  return out;
}

/* ---- Spherical Equivalent ---- */
function genSphEq(n){
  const out=[];
  for(let i=0;i<n;i++){
    const sphere=rndSphere(), cyl=rndCylMinus(), axis=rndAxis();
    const se=round25(sphere+cyl/2);
    out.push({ q:`Rx: ${fmtPow(sphere)} ${fmtPow(cyl)} X ${axis}\nFind the spherical equivalent.`,
               a:`SE = Sphere + &frac12;(Cyl) = ${fmtPow(sphere)} + &frac12;(${fmtPow(cyl)}) = ${fmtPow(sphere)} + (${fmtPow(round25(cyl/2))}) = <b>${fmtPow(se)}</b>` });
  }
  return out;
}

/* ---- Flat Transposition ---- */
function genTranspose(n){
  const out=[];
  for(let i=0;i<n;i++){
    let sphere=rndSphere(), cyl=rndCylMinus(), axis=rndAxis();
    if(Math.random()<0.3){ cyl=-cyl; } // start some in plus-cyl form too
    const newSphere=round25(sphere+cyl), newCyl=round25(-cyl);
    const newAxis = axis<=90 ? axis+90 : axis-90;
    out.push({ q:`Flat-transpose to the opposite cylinder form:\n${fmtPow(sphere)} ${fmtPow(cyl)} X ${axis}`,
               a:`1) ${fmtPow(sphere)} + (${fmtPow(cyl)}) = ${fmtPow(newSphere)} (new sphere)\n2) Flip cyl sign: ${fmtPow(cyl)} &rarr; ${fmtPow(newCyl)}\n3) Axis ${axis} ${axis<=90?'+ 90':'&minus; 90'} = ${newAxis}\n&rarr; <b>${fmtPow(newSphere)} ${fmtPow(newCyl)} X ${newAxis}</b>` });
  }
  return out;
}

/* ---- Vogel's Rule / Base Curve ---- */
function genVogel(n){
  const out=[];
  for(let i=0;i<n;i++){
    const sphere=rndSphere(), cyl=rndCylMinus();
    const se=round25(sphere+cyl/2);
    const bc = se>=0 ? round25(se+6.00) : round25(se/2+6.00);
    out.push({ q:`Rx: ${fmtPow(sphere)} ${fmtPow(cyl)}\nUsing Vogel's Rule, find the recommended front base curve.`,
               a:`SE = ${fmtPow(sphere)} + &frac12;(${fmtPow(cyl)}) = <b>${fmtPow(se)}</b>\n${se>=0? 'Plus Rx &rarr; BC = SE + 6.00 = '+fmtPow(se)+' + 6.00':'Minus Rx &rarr; BC = &frac12;SE + 6.00 = '+fmtPow(round25(se/2))+' + 6.00'} = <b>+${fmtMag(bc)}</b>` });
  }
  return out;
}

/* ---- Vertex Distance ---- */
function genVertex(n){
  const out=[];
  for(let i=0;i<n;i++){
    const power=rndSphere();
    const away = Math.random()<0.5;
    const mm=rndItem([2,3,4,5,6,8,10]);
    const result = away ? 'more PLUS' : 'more MINUS';
    out.push({ q:`A ${fmtPow(power)} lens is moved ${mm}mm <b>${away?'away from':'toward'}</b> the eye. Is the perceived power now more PLUS or more MINUS?`,
               a:`<b>${result}</b>.  Rule: MORE vertex distance (away from eye) = MORE perceived plus power. LESS vertex distance (toward eye) = MORE perceived minus power. This holds for both plus and minus lenses.` });
  }
  return out;
}

/* ---- Add Power Conversion (SV readers / intermediate) ---- */
function genAdd(n){
  const out=[];
  for(let i=0;i<n;i++){
    const sphere=rndSphere(), cyl=rndCylMinus(), axis=rndAxis();
    const add=rndItem([0.75,1.00,1.25,1.50,1.75,2.00,2.25,2.50,2.75,3.00]);
    const readerSphere=round25(sphere+add), intermSphere=round25(sphere+add/2);
    out.push({ q:`Distance Rx: ${fmtPow(sphere)} ${fmtPow(cyl)} X ${axis}    Add: ${fmtPow(add)}\nConvert to (a) single-vision READERS and (b) single-vision INTERMEDIATE.`,
               a:`Readers = Sphere + full Add = ${fmtPow(sphere)} + (${fmtPow(add)}) = <b>${fmtPow(readerSphere)} ${fmtPow(cyl)} X ${axis}</b>\nIntermediate = Sphere + &frac12;Add = ${fmtPow(sphere)} + (${fmtPow(round25(add/2))}) = <b>${fmtPow(intermSphere)} ${fmtPow(cyl)} X ${axis}</b>` });
  }
  return out;
}

/* ---- Refractive Error Classification ---- */
function classify(sphere,cyl){
  if(cyl===0) return sphere<0?'Simple Myopia':(sphere>0?'Simple Hyperopia':'Plano');
  const m1=sphere, m2=round25(sphere+cyl), lo=Math.min(m1,m2), hi=Math.max(m1,m2);
  if(hi<=0) return (lo<0 && hi===0) ? 'Simple Myopic Astigmatism' : 'Compound Myopic Astigmatism';
  if(lo>=0) return (hi>0 && lo===0) ? 'Simple Hyperopic Astigmatism' : 'Compound Hyperopic Astigmatism';
  return 'Mixed Astigmatism';
}
function buildForCategory(cat){
  // All branches are built CONSTRUCTIVELY (never by rejection-sampling a random
  // guess) so they can never loop: each formula is mathematically guaranteed to
  // land in the right category no matter which magnitudes are drawn.
  const mag=()=>rndItem([0.50,0.75,1.00,1.25,1.50,2.00,2.50,3.00]);
  let sphere,cyl;
  if(cat==='Simple Myopia'){ sphere=-mag(); cyl=0; }
  else if(cat==='Simple Hyperopia'){ sphere=mag(); cyl=0; }
  else if(cat==='Simple Myopic Astigmatism'){ sphere=0; cyl=-mag(); }
  else if(cat==='Simple Hyperopic Astigmatism'){ const m=mag(); sphere=m; cyl=-m; }
  else if(cat==='Compound Myopic Astigmatism'){ sphere=-mag(); cyl=-mag(); } // both meridians negative by construction
  else if(cat==='Compound Hyperopic Astigmatism'){
    const smaller=mag(), extra=mag();           // m2=smaller (>0), m1=smaller+extra (>m2>0)
    sphere=round25(smaller+extra); cyl=-extra;    // sphere+cyl = smaller, both positive
  }
  else { // Mixed Astigmatism
    const plusSide=mag(), minusSide=mag();       // m1=+plusSide, m2=-minusSide -> guaranteed opposite signs
    sphere=plusSide; cyl=round25(-minusSide-plusSide);
  }
  return {sphere:round25(sphere), cyl:round25(cyl)};
}
const CATS=['Simple Myopia','Simple Hyperopia','Simple Myopic Astigmatism','Simple Hyperopic Astigmatism','Compound Myopic Astigmatism','Compound Hyperopic Astigmatism','Mixed Astigmatism'];
function genRefError(n){
  const out=[];
  for(let i=0;i<n;i++){
    const cat=rndItem(CATS);
    let rx=buildForCategory(cat), tries=0;
    while(classify(rx.sphere,rx.cyl)!==cat && tries<10){ rx=buildForCategory(cat); tries++; }
    const axis = rx.cyl===0 ? '' : ` X ${rndAxis()}`;
    out.push({ q:`Rx: ${fmtPow(rx.sphere)} ${rx.cyl!==0?fmtPow(rx.cyl):''}${axis}\nWhich refractive error / astigmatism type is this?`,
               a:`<b>${classify(rx.sphere,rx.cyl)}</b>` });
  }
  return out;
}

/* ---- Abbe Value / Specific Gravity / Materials ---- */
const MATERIALS=[
  {name:'Glass (Crown)', n:1.53, abbe:58},
  {name:'CR-39 Plastic', n:1.50, abbe:58},
  {name:'Polycarbonate', n:1.586, abbe:31},
  {name:'Trivex', n:1.53, abbe:44},
  {name:'Mid-Index', n:1.56, abbe:47},
  {name:'1.6x High-Index', n:1.60, abbe:40},
  {name:'1.67 High-Index', n:1.67, abbe:37},
  {name:'1.74 High-Index', n:1.74, abbe:33},
];
function genMaterials(n){
  const out=[];
  for(let i=0;i<n;i++){
    let a=rndItem(MATERIALS), b=rndItem(MATERIALS);
    while(b.name===a.name) b=rndItem(MATERIALS);
    if(Math.random()<0.5){
      const winner = a.n>b.n? a.name : b.name;
      out.push({ q:`Comparing <b>${a.name}</b> (n=${a.n}) and <b>${b.name}</b> (n=${b.n}) at the same Rx power &mdash; which will be THINNER?`,
                 a:`<b>${winner}</b> &mdash; higher index of refraction = thinner lens.` });
    } else {
      const winner = a.abbe>b.abbe? a.name : b.name;
      out.push({ q:`Comparing <b>${a.name}</b> (Abbe=${a.abbe}) and <b>${b.name}</b> (Abbe=${b.abbe}) &mdash; which has LESS chromatic aberration (better optics)?`,
                 a:`<b>${winner}</b> &mdash; higher Abbe value = less chromatic aberration. (Good Abbe = high 40s/low 50s; bad Abbe = 30s.)` });
    }
  }
  return out;
}

/* ---- PRENTICE'S RULE: three problem styles ---- */
function genPrenticeVertical(){
  const mm=rndItem([3,4,5,6,7,8]);
  const raise = Math.random()<0.5;
  const errDir = raise ? 'up' : 'down';
  const odSphere=rndSphere(), osSphere=rndSphere();
  function calc(sphere, side){
    const D=Math.abs(sphere);
    const dir=inducedDir(sphere,'V',errDir);
    const mag=prenticeP(sphere,mm);
    return {dir,mag,D,isPlus:sphere>0,errAbsDir:resolveAbsDir(errDir,side),mm};
  }
  const od=calc(odSphere,'OD'), os=calc(osSphere,'OS');
  const combo=combinePrism(od.dir,od.mag,os.dir,os.mag);
  const q = `<ul>
     <li>Right eye (OD) Rx is <b>${fmtPow(odSphere)} Sphere</b></li>
     <li>Left eye (OS) Rx is <b>${fmtPow(osSphere)} Sphere</b></li>
     <li>Someone ${raise?'squeezed the nose pads together a little too much and <b>raised</b>':'spread the nose pads apart a little too much and <b>lowered</b>'} the OC heights on these glasses <b>${mm}mm</b></li>
     <li>How much prism, and in what direction, will the wearer now experience in each eye — and what is the total combined effect?</li>
   </ul>
   <div class="diagwrap">${eyeDiagramSVG(null,null,true)}</div>`;
  const a = `OD: D=${od.D.toFixed(2)} &times; hcm=${(mm/10).toFixed(2)}cm = <b>${fmtMag(od.mag)}&#916; ${od.dir}</b> (${dirWord(od.dir)})\n`+
            `OS: D=${os.D.toFixed(2)} &times; hcm=${(mm/10).toFixed(2)}cm = <b>${fmtMag(os.mag)}&#916; ${os.dir}</b> (${dirWord(os.dir)})\n`+
            `${od.dir}/${os.dir} &rarr; <span class="tag ${combo.mode}">${combo.mode==='compound'?'COMPOUND (add)':'CANCEL (subtract)'}</span>\n`+
            `Total experienced by wearer: <b>${fmtMag(combo.total)}&#916;</b>${combo.mode==='cancel'? ' net '+dirWord(combo.dominant) : ' (relative vertical imbalance)'}\n`+
            `<div class="diagwrap">${eyeDiagramSVG(od,os,false)}</div>`;
  return {q,a,tall:true};
}
function genPrenticeHorizontal(){
  const mmOD=rndItem([2,3,4,5,6]), mmOS=rndItem([2,3,4,5,6]);
  const errOD=rndItem(['nasal','temporal']), errOS=rndItem(['nasal','temporal']);
  const odSphere=rndSphere(), osSphere=rndSphere();
  function calc(sphere,err,mm,side){
    const D=Math.abs(sphere);
    const dir=inducedDir(sphere,'H',err);
    const mag=prenticeP(sphere,mm);
    return {dir,mag,D,isPlus:sphere>0,errAbsDir:resolveAbsDir(err,side),mm};
  }
  const od=calc(odSphere,errOD,mmOD,'OD'), os=calc(osSphere,errOS,mmOS,'OS');
  const combo=combinePrism(od.dir,od.mag,os.dir,os.mag);
  const q = `<ul>
     <li>OD Rx: <b>${fmtPow(odSphere)} Sphere</b> &mdash; the lab decentered this lens <b>${mmOD}mm</b> too much <b>${errOD}ly</b> (toward the ${errOD==='nasal'?'nose':'temple'})</li>
     <li>OS Rx: <b>${fmtPow(osSphere)} Sphere</b> &mdash; the lab decentered this lens <b>${mmOS}mm</b> too much <b>${errOS}ly</b> (toward the ${errOS==='nasal'?'nose':'temple'})</li>
     <li>How much prism, and in what direction, does the wearer experience in each eye — and what is the combined total?</li>
   </ul>
   <div class="diagwrap">${eyeDiagramSVG(null,null,true)}</div>`;
  const a = `OD: D=${od.D.toFixed(2)} &times; hcm=${(mmOD/10).toFixed(2)}cm = <b>${fmtMag(od.mag)}&#916; ${od.dir}</b> (${dirWord(od.dir)})\n`+
            `OS: D=${os.D.toFixed(2)} &times; hcm=${(mmOS/10).toFixed(2)}cm = <b>${fmtMag(os.mag)}&#916; ${os.dir}</b> (${dirWord(os.dir)})\n`+
            `${od.dir}/${os.dir} &rarr; <span class="tag ${combo.mode}">${combo.mode==='compound'?'COMPOUND (add)':'CANCEL (subtract)'}</span>\n`+
            `Total experienced by wearer: <b>${fmtMag(combo.total)}&#916;</b>${combo.mode==='cancel'? ' net '+dirWord(combo.dominant) : ''}\n`+
            `<div class="diagwrap">${eyeDiagramSVG(od,os,false)}</div>`;
  return {q,a,tall:true};
}
function genPrentice(n){
  const pattern=['A','B'];
  const out=[];
  for(let i=0;i<n;i++){
    const t=pattern[i%pattern.length];
    if(t==='A') out.push(genPrenticeVertical());
    else out.push(genPrenticeHorizontal());
  }
  return out;
}

/* ---- Minimum Blank Size (MBS) ---- */
const MBS_A=[44,46,48,50,52,54,56,58,60];
const MBS_DBL=[14,15,16,17,18,19,20,22];
const MBS_OFFSETS=[-3,-2.5,-2,-1.5,-1,-0.5,0,0.5,1,1.5,2,2.5,3];
function genMBS(n){
  const out=[];
  for(let i=0;i<n;i++){
    const A=rndItem(MBS_A), DBL=rndItem(MBS_DBL);
    const ED=A+rndItem([0,1,2,3,4]);
    const framePD=A+DBL, halfFrame=round2(framePD/2);
    const offOD=rndItem(MBS_OFFSETS), offOS=rndItem(MBS_OFFSETS);
    const pdOD=round2(halfFrame-offOD), pdOS=round2(halfFrame-offOS);
    const decOD=round2(Math.abs(offOD)), decOS=round2(Math.abs(offOS));
    const mbsOD=round2(ED+2*decOD+2), mbsOS=round2(ED+2*decOS+2);
    out.push({ q:`Frame A = ${A}\nFrame ED = ${ED}\nFrame DBL = ${DBL}\nCustomer's PD = ${pdOD}/${pdOS} (OD/OS)\nFind the minimum blank size (MBS) needed for each lens.`,
               a:`Frame PD = A + DBL = ${A} + ${DBL} = ${framePD}, so &frac12; Frame PD = ${halfFrame}\n`+
                 `Decentration OD = |${halfFrame} &minus; ${pdOD}| = ${decOD}\n`+
                 `Decentration OS = |${halfFrame} &minus; ${pdOS}| = ${decOS}\n`+
                 `MBS = ED + 2(decentration) + 2mm chipping allowance\n`+
                 `MBS OD = ${ED} + 2(${decOD}) + 2 = <b>${mbsOD}</b>\n`+
                 `MBS OS = ${ED} + 2(${decOS}) + 2 = <b>${mbsOS}</b>` });
  }
  return out;
}

  {term:'Zonules', def:'Fibrous strands that attach the ciliary body to the crystalline lens.'},
  {term:'Ciliary Body Contracts', def:'The zonules relax, allowing the lens to thicken (adding power) so the eye can focus up close.'},

  {term:'Corneal Epithelium', def:'The outer-most layer of the cornea; it rests on Bowman&rsquo;s Membrane.'},

  {term:'Fibrous Tunic', def:'One of the eye&rsquo;s three layers; consists of the sclera and the cornea.'},
  {term:'Vascular Tunic', def:'One of the eye&rsquo;s three layers; consists of the iris, choroid and ciliary body, and is responsible for nourishment.'},

  {term:'Posterior Chamber', def:'The fluid-filled chamber between the iris and the crystalline lens.'},

function genAnatomy(n){
  const pool = [];
  ANATOMY_TERMS.forEach(t=>pool.push({kind:'term', ...t}));
  ANATOMY_LETTER_ITEMS.forEach(t=>pool.push({kind:'letter', ...t}));
  // shuffle a copy
  const shuffled = pool.slice();
  for(let i=shuffled.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]; }
  const out=[];
  for(let i=0;i<n;i++){
    const item = shuffled[i % shuffled.length];
    if(item.kind==='letter'){
      const imgSrc = item.img==='EXTERNAL_LETTERED_IMG' ? EXTERNAL_LETTERED_IMG : IRIS_LETTERED_IMG;
      out.push({
        q:`<img class="anatomy-img" src="${imgSrc}" alt="Labeled eye photo from the ABO Study Guide">`+
          `<div class="anatomy-cap">${item.cap}</div>`+
          `In the photo above, what structure is labeled <b>${item.letter}</b>?`,
        a:`<b>${item.term}</b> &mdash; ${item.def}`,
        tall:true
      });
    } else if(Math.random()<0.5){
      out.push({ q:`What is the <b>${item.term}</b>?`, a:item.def });
    } else {
      out.push({ q:`Which structure or concept is being described?<br>&ldquo;${item.def.replace(/<b>|<\/b>/g,'')}&rdquo;`, a:`<b>${item.term}</b>` });
    }
  }
  return out;
}

{
  id:'mbs', group:'Lab & Fitting', title:'Minimum Blank Size (MBS)',
  formula:'MBS = ED + 2(Decentration) + 2mm',
  formulaSub:'Decentration per lens = &frac12;(Frame PD) &minus; Monocular PD &nbsp;|&nbsp; Frame PD = A + DBL &nbsp;|&nbsp; +2mm = chipping allowance',
  teach:`<ul>
    <li><b>ED</b> (effective diameter) = the frame's largest lens diameter, measured from the geometric/boxing center &mdash; always &ge; A.</li>
    <li><b>Frame PD</b> = A + DBL (frame A-measurement + distance between lenses).</li>
    <li><b>Decentration</b> per lens = half the Frame PD minus that eye's monocular PD. It's the distance the lensmaker must shift the optical center away from the frame's own geometric center to match the wearer's PD.</li>
    <li>The blank must cover the full ED PLUS that decentration on both sides, PLUS a small <b>2mm chipping allowance</b> for edging.</li>
    <li>The eye with the <b>smaller monocular PD</b> decenters more (needs a bigger blank).</li>
  </ul>`,
  example:`<div class="example">Frame A=48, ED=51, DBL=15, PD=28/31.<br>
    Frame PD = 48+15=63 &rarr; &frac12; = 31.5<br>
    Dec OD = |31.5&minus;28| = 3.5 &nbsp;&nbsp; Dec OS = |31.5&minus;31| = 0.5<br>
    MBS OD = 51 + 2(3.5) + 2 = <b>60</b> &nbsp;&nbsp; MBS OS = 51 + 2(0.5) + 2 = <b>54</b></div>`,
  perPage:8, pages:5, generate:genMBS
},
{
  id:'oblique', group:'Advanced (Not Needed)', title:'Power in Oblique Meridians',
  formula:'D&theta; = Sphere + Cyl &times; sin&sup2;(&theta; &minus; Axis)',
  formulaSub:'the GENERAL formula &mdash; 180&deg;/90&deg; are just the special cases where sin&sup2;=0 or 1',
  sourceNote:'Not explicitly worked out in the Laramy-K guide itself &mdash; the guide always dodges oblique angles by flat-transposing to 180&deg;/90&deg; instead (see "The Optical Cross"). This formula is standard ophthalmic-optics theory, included because "Power in oblique meridians" is its own line item on the official NOCE exam content outline (Domain I, 14.5) reprinted in the guide\'s appendix. Kept here for reference only &mdash; not needed for the exam itself.',
  teach:`<ul>
    <li>&theta; = the meridian you want the power for. Axis = the Rx's stated axis. Both in degrees.</li>
    <li>When &theta; = Axis, sin&sup2;(0)=0, so D&theta;=Sphere &mdash; matches the Optical Cross rule.</li>
    <li>When &theta; is 90&deg; from Axis, sin&sup2;(90&deg;)=1, so D&theta;=Sphere+Cyl &mdash; also matches.</li>
    <li>For anything in between, sin&sup2; gives you a fraction of the cylinder &mdash; this is the formula that makes the 90&deg;/180&deg; shortcut work in the first place.</li>
  </ul>`,
  example:`<div class="example">&minus;2.00 &minus;2.00 X180, find power at 45&deg;:<br>
    D45 = &minus;2.00 + (&minus;2.00) &times; sin&sup2;(45&deg;&minus;180&deg;) = &minus;2.00 + (&minus;2.00 &times; 0.50) = <b>&minus;3.00</b></div>`,
  perPage:8, pages:5, generate:genOblique
},
];

/* ============================================================
   APP STATE / RENDERING
   ============================================================ */
let currentTopicId = TOPICS[0].id;
let currentProblems = [];

function getTopic(id){ return TOPICS.find(t=>t.id===id); }

function renderNav(){
  const groups = [];
  TOPICS.forEach(t=>{ if(!groups.includes(t.group)) groups.push(t.group); });
  let html='';
  groups.forEach(g=>{
    html += `<div class="grp-label">${g}</div>`;
    TOPICS.filter(t=>t.group===g).forEach(t=>{
      html += `<button class="navbtn${t.id===currentTopicId?' active':''}" data-id="${t.id}">${t.title}</button>`;
    });
  });
  document.getElementById('navlist').innerHTML = html;
  document.querySelectorAll('#navlist .navbtn').forEach(b=>{
    b.addEventListener('click', ()=>{ currentTopicId=b.dataset.id; renderTopic(); });
  });
}

function newProblems(){
  const t = getTopic(currentTopicId);
  currentProblems = t.generate(t.perPage*t.pages);
  renderProblemList();
}

function renderProblemList(){
  const list = document.getElementById('problemList');
  if(!list) return;
  list.innerHTML = currentProblems.map((p,i)=>`
    <div class="problem">
      <div><span class="qn">${i+1}.</span><span class="qtext">${p.q}</span></div>
      <div class="ans"><b>Answer:</b> ${p.a}</div>
    </div>`).join('');
}

function toggleAnswers(){
  document.getElementById('problemList').classList.toggle('hide-answers');
}

function renderTopic(){
  const t = getTopic(currentTopicId);
  renderNav();
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="formula-box">
      <div class="label">${t.group}</div>
      <h1 style="color:#fff;margin:0 0 4px;font-size:22px;">${t.title}</h1>
      <div class="math">${t.formula}</div>
      <div class="sub">${t.formulaSub||''}</div>
    </div>
    <div class="card">
      <h2>Concept</h2>
      ${t.sourceNote? `<div class="sourcenote">&#9432; ${t.sourceNote}</div>` : ''}
      ${t.teach}
      ${t.example||''}
    </div>
    <div class="card">
      <h2>Practice</h2>
      <div class="controls no-print">
        <button id="btnNew">&#128260; New Problem Set</button>
        <button id="btnToggle" class="secondary">&#128065; Show/Hide Answers</button>
        <button id="btnPrintStudy" class="ghost">&#128424; Print Formula Sheet</button>
        <button id="btnPrintPractice" class="ghost">&#128424; Print 5 Pages of Practice</button>
        <span class="count-note">${t.perPage} problems &times; ${t.pages} pages = ${t.perPage*t.pages} total</span>
      </div>
      <div id="problemList"></div>
    </div>
    <footer class="note">ABO Formula Mastery Trainer &mdash; formulas &amp; worked examples sourced from the Laramy-K OpticianWorks Ultimate ABO Study Guide v6.23 unless flagged above with &#9432;. Every generator is unit-tested for internal correctness (and, where the guide provides one, checked against its own worked answer).</footer>
  `;
  document.getElementById('btnNew').addEventListener('click', newProblems);
  document.getElementById('btnToggle').addEventListener('click', toggleAnswers);
  document.getElementById('btnPrintStudy').addEventListener('click', ()=>printStudy(t));
  document.getElementById('btnPrintPractice').addEventListener('click', ()=>printPractice(t));
  newProblems();
}

/* ============================================================
   PRINTING
   ============================================================ */
function doPrint(html){
  document.getElementById('printArea').innerHTML = html;
  document.body.classList.add('print-mode');
  window.print();
}
window.addEventListener('afterprint', ()=>{
  document.body.classList.remove('print-mode');
});

function printStudy(t){
  const html = `<div class="sheet">
    <div class="printhead"><h2>${t.title}</h2><span class="brand">ABO Formula Mastery Trainer</span></div>
    <div class="math" style="font-size:24px;font-family:Georgia,serif;margin:6px 0;">${t.formula}</div>
    <div style="color:#555;margin-bottom:10px;">${t.formulaSub||''}</div>
    ${t.sourceNote? `<div class="sourcenote">&#9432; ${t.sourceNote}</div>` : ''}
    ${t.teach}
    ${t.example||''}
  </div>`;
  doPrint(html);
}

function printPractice(t){
  const total = t.perPage*t.pages;
  const problems = t.generate(total);
  const pages = chunk(problems, t.perPage);
  let html='';
  pages.forEach((pg,pi)=>{
    html += `<div class="sheet"><div class="printhead"><h2>${t.title} &mdash; Practice</h2><span class="brand">Page ${pi+1} of ${pages.length}</span></div>`;
    pg.forEach((p,i)=>{
      const num = pi*t.perPage + i + 1;
      html += `<div class="problem"><span class="qn">${num}.</span> <span class="qtext">${p.q}</span>
        <div class="workspace${p.tall?' compact':''}"></div></div>`;
    });
    html += `</div>`;
  });
  // answer key
  const keyChunks = chunk(problems, 14);
  keyChunks.forEach((kc,ki)=>{
    html += `<div class="sheet"><div class="printhead"><h2>${t.title} &mdash; Answer Key</h2><span class="brand">Key ${ki+1} of ${keyChunks.length}</span></div>`;
    kc.forEach((p,i)=>{
      const num = ki*14 + i + 1;
      html += `<div class="answerline"><b>${num}.</b> ${p.a.replace(/<div class="diagwrap">[\s\S]*?<\/div>/,'')}</div>`;
    });
    html += `</div>`;
  });
  doPrint(html);
}

/* ---- boot ---- */
renderTopic();
</script>
</body>
</html>
