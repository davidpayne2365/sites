  .group-header:first-child { margin-top: 0.2rem; }
  li.item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.55rem 0.6rem;
    cursor: pointer;
  }
  .done-checkbox {
    width: 22px;
    height: 22px;
    min-width: 22px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .title-block {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }
  .section-badge {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  .title-text {
    font-size: 0.92rem;
    line-height: 1.25;
    word-break: break-word;
  }
  .percent-text {
    font-size: 0.78rem;
    font-weight: 700;
    min-width: 2.6rem;
    text-align: right;
    color: var(--muted);
  }
  .bar {
    height: 4px;
    background: var(--track);
    margin: 0 0.6rem 0.55rem;
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    transition: width 0.3s ease, background 0.3s ease;
  }
  .player-wrap {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.32s ease;
  }
  .player-wrap.open {
    max-height: 640px;
  }
  .player-aspect {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }
  .player-aspect iframe,
  .player-aspect > div {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  li.item.complete {
    border-color: color-mix(in srgb, #22c55e 45%, var(--border));
  }

const STORAGE_KEY = "pmProgress";
const DONE_THRESHOLD = 97;

function loadProgress() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (e) {
    return {};
  }
}
function saveProgress(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let progress = loadProgress();

function getEntry(id) {
  return progress[id] || { percent: 0, manualDone: false };
}
function effectivePercent(id) {
  const e = getEntry(id);
  return e.manualDone ? 100 : (e.percent || 0);
}
function percentColor(pct) {
  if (pct >= 100) return "#22c55e";
  const hue = Math.max(0, Math.min(120, pct * 1.2));
  return `hsl(${hue}, 72%, 45%)`;
}

function updateRowUI(id) {
  const li = document.querySelector(`li[data-id="${id}"]`);
  if (!li) return;
  const pct = effectivePercent(id);
  const color = percentColor(pct);
  li.querySelector(".percent-text").textContent = pct + "%";
  li.querySelector(".percent-text").style.color = color;
  const fill = li.querySelector(".bar-fill");
  fill.style.width = pct + "%";
  fill.style.background = color;
  li.classList.toggle("complete", pct >= 100);
  li.querySelector(".done-checkbox").checked = getEntry(id).manualDone;
}

function updateSummary() {
  const total = VIDEOS.length;
  const done = VIDEOS.filter(v => effectivePercent(v.id) >= DONE_THRESHOLD).length;
  const avg = Math.round(VIDEOS.reduce((s, v) => s + effectivePercent(v.id), 0) / total);
  document.getElementById("summaryText").textContent = `${done} / ${total} complete`;
  const fill = document.getElementById("summaryFill");
  fill.style.width = avg + "%";
  fill.style.background = percentColor(avg);
}

let ytApiReady = false;
let currentPlayer = null;
let currentPollId = null;
let currentOpenId = null;

function recordPosition(id) {
  if (!currentPlayer || typeof currentPlayer.getDuration !== "function") return;
  try {
    const dur = currentPlayer.getDuration();
    const cur = currentPlayer.getCurrentTime();
    if (dur > 0) {
      const pct = Math.min(100, Math.round((cur / dur) * 100));
      const entry = getEntry(id);
      entry.lastPosition = cur;
      if (pct > (entry.percent || 0)) entry.percent = pct;
      progress[id] = entry;
      saveProgress(progress);
      updateRowUI(id);
      updateSummary();
    }
  } catch (e) {}
}

function stopPolling() {
  if (currentPollId) {
    clearInterval(currentPollId);
    currentPollId = null;
  }
}

function destroyCurrentPlayer() {
  if (currentOpenId) recordPosition(currentOpenId);
  stopPolling();
  if (currentPlayer && typeof currentPlayer.destroy === "function") {
    currentPlayer.destroy();
  }
  currentPlayer = null;
}

function createPlayer(id) {
  const entry = getEntry(id);
  const startAt = Math.floor(entry.lastPosition || 0);
  currentPlayer = new YT.Player(`player-${id}`, {
    videoId: id,
    playerVars: startAt > 0 ? { rel: 0, start: startAt } : { rel: 0 },
    events: {
      onStateChange: (event) => {
        if (event.data === YT.PlayerState.PLAYING) {
          stopPolling();
          currentPollId = setInterval(() => recordPosition(id), 2000);
        } else if (event.data === YT.PlayerState.ENDED) {
          const e = getEntry(id);
          e.percent = 100;
          e.lastPosition = 0;
          progress[id] = e;
          saveProgress(progress);
          updateRowUI(id);
          updateSummary();
          stopPolling();
        } else {
          recordPosition(id);
          stopPolling();
        }
      }
    }
  });
}

function toggleExpand(id) {
  const li = document.querySelector(`li[data-id="${id}"]`);
  const wrap = li.querySelector(".player-wrap");

  if (currentOpenId === id) {
    wrap.classList.remove("open");
    destroyCurrentPlayer();
    currentOpenId = null;
    return;
  }

  if (currentOpenId) {
    const prevLi = document.querySelector(`li[data-id="${currentOpenId}"]`);
    if (prevLi) prevLi.querySelector(".player-wrap").classList.remove("open");
    destroyCurrentPlayer();
  }

  currentOpenId = id;
  wrap.classList.add("open");
  const holder = wrap.querySelector(".player-aspect");
  holder.innerHTML = `<div id="player-${id}"></div>`;

  if (ytApiReady) {
    createPlayer(id);
  } else {
    const check = setInterval(() => {
      if (ytApiReady) {
        clearInterval(check);
        createPlayer(id);
      }
    }, 200);
  }
}

function toggleDone(id, checked) {
  const entry = getEntry(id);
  entry.manualDone = checked;
  progress[id] = entry;
  saveProgress(progress);
  updateRowUI(id);
  updateSummary();
}

function render() {
  const list = document.getElementById("list");
  let lastGroup = null;
  VIDEOS.forEach(v => {
    if (v.group !== lastGroup) {
      const h = document.createElement("li");
      h.className = "group-header";
      h.textContent = v.group;
      list.appendChild(h);
      lastGroup = v.group;
    }

    const li = document.createElement("li");
    li.className = "item";
    li.dataset.id = v.id;
    li.innerHTML = `
      <div class="row">
        <input type="checkbox" class="done-checkbox" aria-label="Mark complete">
        <div class="title-block">
          ${v.section ? `<span class="section-badge">${v.section}</span>` : ""}
          <span class="title-text">${v.title}</span>
        </div>
        <span class="percent-text">0%</span>
      </div>
      <div class="bar"><div class="bar-fill"></div></div>
      <div class="player-wrap"><div class="player-aspect"></div></div>
    `;

    li.querySelector(".row").addEventListener("click", (e) => {
      if (e.target.classList.contains("done-checkbox")) return;
      toggleExpand(v.id);
    });
    li.querySelector(".done-checkbox").addEventListener("click", (e) => {
      e.stopPropagation();
      toggleDone(v.id, e.target.checked);
    });

    list.appendChild(li);
    updateRowUI(v.id);
  });
  updateSummary();
}

window.onYouTubeIframeAPIReady = () => { ytApiReady = true; };

render();

const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
